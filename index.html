<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <title>世界之光聖教會 | <%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 只有淺色主題（ux.md §7），瀏覽器不要自動套深色 -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="<%= publicPath %>icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="<%= publicPath %>icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="<%= publicPath %>favicon.ico" />

    <!-- 分享連結時的預覽（Facebook、LINE、LinkedIn 等；ux.md U1）
         og-image.jpg：logo_2.jpg 置中放在 1200×630 的同色底上（FB、LinkedIn 建議尺寸）。
         網址必須是完整網址，由建置時的 QCLI_SITE_URL 組成（deploy.yml）。 -->
    <% if (siteUrl) { %>
    <link rel="canonical" href="<%= siteUrl %>/" />
    <meta property="og:url" content="<%= siteUrl %>/" />
    <% } %>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:site_name" content="世界之光聖教會 | <%= productName %>" />
    <meta property="og:title" content="世界之光聖教會 | <%= productName %>" />
    <meta property="og:description" content="<%= productDescription %>" />
    <meta property="og:image" content="<%= siteUrl ? siteUrl + '/' : publicPath %>og-image.jpg" />
    <meta property="og:image:secure_url" content="<%= siteUrl ? siteUrl + '/' : publicPath %>og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="世界之光聖教會標誌" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>icons/apple-icon-180x180.png"
    />
  </head>
  <body>
    <!-- 給不執行 JavaScript 的爬蟲與分享預覽檢查工具：頁面本身由 App 產生 -->
    <noscript>
      <h1>世界之光聖教會 | ECHO</h1>
      <p><%= productDescription %>。請開啟 JavaScript 使用。</p>
    </noscript>
    <!-- quasar:entry-point -->
  </body>
</html>
